# Full Mediterranean region pack (ticket R2-lite), Gibraltar to the
# Aegean. Real GEBCO/GSHHG/NOMADS/WPI data, ingested live via the same
# bbox-parametric scripts B7/R1 built (docs/region-pack-runbook.md).
#
# Deliberately SUPERSETS the existing `med` pack's own OPERATING_AREA_BBOX
# coverage -- `med` (data/region_packs/med.yaml) is untouched, its own
# committed test npz/hand-drawn corridors stay regression surface; the
# two packs coexist, retiring `med` is a separate decision not made here.
#
# No-go/TSS zones are an honest empty placeholder (nogo_med_full.json/
# tss_med_full.json) -- unresearched this ticket; real candidates named
# there (Gibraltar Strait TSS, Strait of Messina TSS) for a future pick-up.
#
# Ports are real, live NGA World Port Index data (306 ports in this bbox,
# all inlined below -- no curation, matching uk_sw.yaml's own precedent).
#
# Findings (acceptance run, 2026-07-22), same shape as uk_sw.yaml's own
# header, left visible not silently tuned away:
# (1) WPI's raw "palma_de_mallorca" pin (39.56667, 2.63333) sits on
#     rasterized land (the city/harbour front) at this bbox's real GSHHG
#     resolution.
# (2) A first, small nudge (~0.008deg south into Palma Bay, individually
#     navigable, depth ~7.5m) looked sufficient by the point-navigability
#     check alone but was NOT -- optimise() still raised "baseline route
#     infeasible": at this new, much longer passage (330nm vs. the
#     existing med pack's own ~180nm), the lattice's very first stage
#     transition (~11nm, this pack's own derived along_track_step_nm) found
#     almost every departure leg from that point crossing back over
#     Mallorca's coastline -- the exact Bonifacio scattered-islet lesson
#     (ticket 0.8) again: individual point navigability is not enough,
#     the LEG between two navigable points can still cross land. Confirmed
#     directly (evaluate_leg over the full lane fan): the shallow nudge
#     had only 1/33 lanes with a genuinely clear first leg; deeper into
#     Palma Bay clearance improves with distance from the coast.
# A better-nudged Palma point (~0.2deg south, well into open Palma Bay,
# depth ~64.5m, real leg clearance confirmed directly against the built
# lattice -- the search then reaches the destination with 1093 reachable
# nodes instead of 1) fixed that specific problem, but surfaced a THIRD,
# more fundamental finding, deliberately not "fixed" under this ticket's
# own no-new-engineering scope: `optimise()`'s own `_baseline_route`
# (existing, unmodified code -- fixed 14kn/2-engine reference speed, `core/
# optimiser.py`'s `BASELINE_SPEED_KN`) could not complete a continuous
# single-speed passage from Palma to Porto Cervo even though the real
# multi-speed candidate search succeeded -- traced to a genuine
# destination-side chokepoint (a lattice stage near Sardinia's coast,
# `navigable_edge_fraction=0.0` even after adaptive refinement to the
# floor) that a fixed 14kn/2-engine passage apparently cannot clear
# end-to-end, while a route mixing several different candidate speeds
# can. This is real, existing `core/optimiser.py` machinery behaving
# consistently (not a new bug) -- it just never got exercised by a
# passage this long/constrained before. Not investigated further or
# fixed here (would mean touching core/optimiser.py, out of scope for a
# data-only ticket) -- named as a real follow-up for whichever future
# ticket tackles longer/harder cross-basin passages (arguably closer to
# R3's own "ocean-crossing" scope than R2's region-pack scope).
#
# **default_origin/default_destination below therefore reuse the
# existing `med` pack's own already-proven-feasible Antibes<->Porto Cervo
# pair** instead of the more ambitious Palma<->Porto Cervo crossing --
# real, verified feasible through this much larger pack's own real
# GEBCO/GSHHG/weather data (score 13505.24, detour ratio 1.0501, 24.4s
# wall-clock -- see docs/plans/ticket-R2-lite.md for the real comparison
# against the small `med` pack's own ~6s for literally the same passage,
# a real, separate finding about geography-lookup cost at this bbox
# scale). The Palma-side investigation and its real coordinates are kept
# in this comment, not discarded, since a future ticket picking up the
# cross-basin follow-up above will want the exact starting point.
# Palma nudge, for that future reference: (39.3667, 2.6333333333333333).

