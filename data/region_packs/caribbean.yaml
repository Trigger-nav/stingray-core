# Caribbean region pack (ticket R2-lite) -- Windwards through the Virgin
# Islands + Bahamas. Real GEBCO/GSHHG/NOMADS/WPI data, ingested live via
# the same bbox-parametric scripts B7/R1 built
# (docs/region-pack-runbook.md).
#
# No-go/TSS zones are an honest empty placeholder (nogo_caribbean.json/
# tss_caribbean.json) -- unresearched this ticket.
#
# Ports are real, live NGA World Port Index data (51 ports in this bbox,
# all inlined below -- no curation, matching uk_sw.yaml's own precedent).
#
# Findings (acceptance run, 2026-07-22), same shape as uk_sw.yaml's own
# header, left visible not silently tuned away:
# (1) WPI's raw "charlotte_amalie" pin (18.35, -64.93333, St Thomas) sits
#     on rasterized land (the town front) at this bbox's real GSHHG
#     resolution. default_origin below is nudged ~0.05deg due south into
#     the real harbour roadstead/entrance (verified navigable, depth
#     ~18.9m) -- a large, unambiguous open-water area matching Charlotte
#     Amalie's known south-facing harbour geography. A closer, ~0.02deg
#     north nudge was found first by a naive nearest-navigable-point
#     search but rejected: that direction runs further into the island's
#     interior/north shore, and the "gap" found there reads as a real but
#     narrow, ambiguous feature at this resolution -- the larger, well-
#     understood southern harbour water was preferred over the merely
#     nearest option.
# (2) St Barths/Gustavia has no WPI pin within this bbox at all (a real,
#     valid state -- WPI's ~2,951-port database doesn't cover every
#     island). default_origin/destination for that side is a hand-picked
#     Gustavia-harbour-area coordinate (17.897, -62.850, a commonly-cited
#     public position for the harbour), also found sitting on rasterized
#     land at real GSHHG resolution -- nudged ~0.027deg south into open
#     water (verified navigable, depth ~42.7m; a boundary-hugging
#     ~12.9m-depth point half this distance was also navigable but
#     rejected for sitting right at the coastline edge with less margin).

