name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system eccodes (cfgrib's C library)
        # Required by the `ingest` extras (cfgrib). The libeccodes-dev apt
        # route on Ubuntu was verified live during the 2026-07-13 Hetzner
        # deploy (see CLAUDE.md's eccodes gotcha) -- GitHub's ubuntu-latest
        # runners use the same package.
        run: sudo apt-get update && sudo apt-get install -y libeccodes-dev
      - name: Install
        # ALL extras: CLAUDE.md's convention says `pytest -m ""` full-suite
        # is "what CI runs" -- which requires the ingest/fit dependency
        # sets too. The previous api/capture-only install left every
        # tests/test_ingest_*.py file erroring at collection (xarray etc.
        # missing) from ticket B7 onward -- CI was failing on import
        # errors, not real test failures (fixed 2026-07-22).
        run: pip install -e ".[dev,api,capture,ingest,fit]"
      - name: Lint
        run: ruff check .
      - name: Test (full suite, incl. slow)
        run: pytest -m ""
