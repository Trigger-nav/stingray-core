[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stingray"
version = "0.1.0"
description = "Stingray passage & performance optimisation core"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# Ingest-only: one-time data preprocessing (GSHHG shapefile parsing/clipping,
# GEBCO remote netCDF subsetting, GRIB2 weather parsing). core/ stays at
# numpy+PyYAML only — these never get imported at runtime, only by scripts
# under ingest/.
ingest = [
    "pyshp>=2.3",
    "shapely>=2.0",
    "xarray>=2024.1",
    "h5netcdf>=1.3",
    "h5py>=3.10",
    "fsspec>=2024.2",
    "aiohttp>=3.9",
    # cfgrib additionally requires the system eccodes C library --
    # `brew install eccodes` (macOS) / `apt-get install libeccodes-dev`
    # (Debian/Ubuntu, incl. GitHub Actions runners) -- not installable via
    # pip alone. See CLAUDE.md's GRIB-conventions gotcha.
    "cfgrib>=0.9",
    # xarray's .interp() (WW3-wave -> GFS-wind grid resampling in
    # fetch_grib_nomads.py) requires scipy at runtime -- found on first
    # real run, missing from the original ticket 0.5 declaration.
    "scipy>=1.11",
]
# fit/-only: twin parameter fitting (ticket 0.6) needs real nonlinear
# least-squares (scipy.optimize) -- core/ stays numpy+PyYAML only (see
# above), and this is a different concern from ingest/'s network data
# acquisition, so it's its own extras group rather than folded into
# `ingest` (which happens to already carry scipy for an unrelated reason).
fit = [
    "scipy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["core", "ingest", "fit"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["prototype"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default `pytest` run excludes `slow` (RealGeography-heavy searches --
# one test alone, test_every_returned_track_is_navigable_at_fine_resolution,
# is ~370s of a ~414s full run). Full suite (CI, or before committing an
# optimiser change): `pytest -m ""` overrides this back to running
# everything -- see .github/workflows/ci.yml.
addopts = "-m 'not slow'"
markers = [
    "slow: RealGeography-heavy searches (multi-minute); excluded by default, see addopts",
]
