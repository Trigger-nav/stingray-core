[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stingray"
version = "0.1.0"
description = "Stingray passage & performance optimisation core"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    # FastAPI's TestClient (tests/test_api_routes.py etc., ticket B1)
    # requires httpx even though api/ itself never imports it directly.
    "httpx>=0.28",
]
# Ingest-only: one-time data preprocessing (GSHHG shapefile parsing/clipping,
# GEBCO remote netCDF subsetting, GRIB2 weather parsing). core/ stays at
# numpy+PyYAML only — these never get imported at runtime, only by scripts
# under ingest/.
ingest = [
    "pyshp>=2.3",
    "shapely>=2.0",
    "xarray>=2024.1",
    "h5netcdf>=1.3",
    "h5py>=3.10",
    "fsspec>=2024.2",
    "aiohttp>=3.9",
    # cfgrib additionally requires the system eccodes C library --
    # `brew install eccodes` (macOS) / `apt-get install libeccodes-dev`
    # (Debian/Ubuntu, incl. GitHub Actions runners) -- not installable via
    # pip alone. See CLAUDE.md's GRIB-conventions gotcha.
    "cfgrib>=0.9",
    # xarray's .interp() (WW3-wave -> GFS-wind grid resampling in
    # fetch_grib_nomads.py) requires scipy at runtime -- found on first
    # real run, missing from the original ticket 0.5 declaration.
    "scipy>=1.11",
]
# fit/-only: twin parameter fitting (ticket 0.6) needs real nonlinear
# least-squares (scipy.optimize) -- core/ stays numpy+PyYAML only (see
# above), and this is a different concern from ingest/'s network data
# acquisition, so it's its own extras group rather than folded into
# `ingest` (which happens to already carry scipy for an unrelated reason).
fit = [
    "scipy>=1.11",
]
# api/-only: the planner service (ticket B1) -- job-shaped FastAPI wrapper
# over core.optimiser.optimise. Deliberately excludes ingest's cfgrib/
# eccodes: api/ must build cleanly on Windows/macOS via PyInstaller for the
# bridge-PC target (docs/plans/ticket-B1.md design 6/11), and eccodes is a
# system C library, not pip-installable, notoriously fragile to bundle
# cross-platform -- so heavy GRIB ingest stays cloud-role-only, invoked as
# a separate `ingest` extras install on the cloud VM, never imported here.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    # Already an installed transitive dependency of uvicorn[standard];
    # declared directly since deploy/stingray_cli.py relies on it
    # directly too (loading a .env file uniformly across all three
    # service-wrapper mechanisms -- systemd/launchd/NSSM -- design 11).
    "python-dotenv>=1.0",
]
# capture/-only: the logging service (ticket B1/B5) -- NMEA 2000 gateway
# abstraction + PGN decode + local telemetry store. Version floors
# confirmed live against PyPI during planning (real current versions
# 2026.5.2/3.5, not guessed -- see docs/plans/ticket-B1.md's
# "Implementation order").
capture = [
    "nmea2000>=2026.5",
    "pyserial>=3.5",
]

[tool.hatch.build.targets.wheel]
packages = ["core", "ingest", "fit", "api", "capture"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["prototype"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default `pytest` run excludes `slow` (RealGeography-heavy searches --
# one test alone, test_every_returned_track_is_navigable_at_fine_resolution,
# is ~370s of a ~414s full run). Full suite (CI, or before committing an
# optimiser change): `pytest -m ""` overrides this back to running
# everything -- see .github/workflows/ci.yml.
addopts = "-m 'not slow'"
markers = [
    "slow: RealGeography-heavy searches (multi-minute); excluded by default, see addopts",
]
